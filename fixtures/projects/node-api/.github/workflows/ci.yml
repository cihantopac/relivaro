name: CI
on:
  pull_request_target:
  issues:
    types: [opened]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: some-org/setup-thing@v2
      - run: npm ci && npm test
      - name: Greet
        run: echo "Thanks for ${{ github.event.issue.title }}"
