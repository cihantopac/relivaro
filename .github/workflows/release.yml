name: Release

# Builds and verifies the npm package and creates a draft GitHub release. Publishing to npm is a manual step that
# requires the maintainer's approval (see docs/RELEASING.md); this workflow never publishes on its own.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to draft (e.g. v1.0.0)
        required: true

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci
      - run: node scripts/smoke-install.mjs
      - name: Check tag matches package.json
        env:
          TAG: ${{ inputs.tag }}
        run: test "$TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm pack
      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" relivaro-*.tgz --draft --title "Relivaro $TAG" --notes-file CHANGELOG.md
